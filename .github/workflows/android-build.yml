name: Android build and intent tests
on:
  push:
    paths: ['android/**', 'crier/connection-service.json', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['android/**', 'crier/connection-service.json', '.github/workflows/android-build.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-and-tests
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
