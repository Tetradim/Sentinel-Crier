name: Provider Edge integration
on:
  workflow_dispatch:
  push:
    paths: ['supabase/provider-connect/**', 'supabase/functions/crier-oauth/**', 'supabase/tests/provider*', 'supabase/tests/run-provider*', 'supabase/tests/integration/provider*', '.github/workflows/provider-edge-tests.yml']
  pull_request:
    paths: ['supabase/provider-connect/**', 'supabase/functions/crier-oauth/**', 'supabase/tests/provider*', 'supabase/tests/run-provider*', 'supabase/tests/integration/provider*', '.github/workflows/provider-edge-tests.yml']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: provider_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix supabase/tests
      - name: Candidate SQL permissions and synthetic end-to-end gateway
        run: |
          node supabase/tests/run-provider-sql-tests.mjs
          node --experimental-strip-types supabase/tests/provider-edge-integration.mjs > provider-edge-acceptance.json
      - name: Real Postgres permissions and concurrent one-use transitions
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: local-test-only
          PGDATABASE: provider_test
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role; CREATE SCHEMA extensions;'
          psql -v ON_ERROR_STOP=1 -f supabase/provider-connect/flow_store.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/provider_flows.sql
          psql -v ON_ERROR_STOP=1 -c "SET crier.test_dsn = 'host=127.0.0.1 port=5432 dbname=provider_test user=postgres password=local-test-only';" -f supabase/tests/integration/provider_flows_concurrency.sql
      - name: Deno contracts, cryptography, authentication and gateway checks
        run: |
          npm exec --yes --package deno@2.9.6 -- deno test supabase/provider-connect
          npm exec --yes --package deno@2.9.6 -- deno check supabase/functions/crier-oauth/index.ts
          npm exec --yes --package deno@2.9.6 -- deno lint supabase/provider-connect supabase/functions/crier-oauth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-edge-acceptance
          path: provider-edge-acceptance.json
          if-no-files-found: warn
