name: Android release packaging
on:
  pull_request:
    paths: ['android/**', 'scripts/android-release*', '.github/workflows/android-release.yml', 'release.json']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Stable versionName (MAJOR.MINOR.PATCH)'
        required: true
        default: '0.2.0'
      version_code:
        description: 'New versionCode; must exceed highest previously distributed code'
        required: true
        default: '2'
      previous_version_code:
        description: 'Highest versionCode already distributed, including private APKs'
        required: true
        default: '1'
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unsigned-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python scripts/android-release-test.py
      - name: Offline tests and unsigned release compilation (no distributable)
        run: gradle --no-daemon :app:testDebugUnitTest :app:compileReleaseKotlin :app:processReleaseResources
        working-directory: android
      - name: Prove release packaging fails without signing
        shell: bash
        working-directory: android
        run: |
          if gradle --no-daemon :app:assembleRelease > "$RUNNER_TEMP/unsigned-release.log" 2>&1; then
            echo 'Release packaging unexpectedly accepted missing signing identity'
            exit 1
          fi
          grep -F 'Release packaging requires all ANDROID_KEYSTORE_PATH' "$RUNNER_TEMP/unsigned-release.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unsigned-validation-tests
          path: android/app/build/reports/tests/
  signed-release:
    if: github.event_name == 'workflow_dispatch'
    needs: unsigned-validation
    environment: android-signing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and verify operator-signed APK and AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required android-signing secret: $name"; exit 1; fi
          done
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/crier-release.jks"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          gradle --no-daemon -p android :app:assembleRelease :app:bundleRelease
          python scripts/android-release-manifest.py \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --output android/app/build/outputs/release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-${{ inputs.version_name }}-${{ inputs.version_code }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/release-manifest.json
