name: Customer acceptance
on:
  workflow_dispatch:
  push:
    paths: ['crier/customer*', 'crier/desktop*', 'android/**', 'ios/**', 'tests/test_customer*', 'scripts/customer_acceptance.py', '.github/workflows/customer-acceptance.yml']
  pull_request:
    paths: ['crier/customer*', 'crier/desktop*', 'android/**', 'ios/**', 'tests/test_customer*', 'scripts/customer_acceptance.py', '.github/workflows/customer-acceptance.yml']
permissions:
  contents: read
jobs:
  windows-journeys:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[test,oauth]"
      - run: python scripts/customer_acceptance.py --output "$env:RUNNER_TEMP/customer-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-acceptance-windows
          path: ${{ runner.temp }}/customer-acceptance
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable hosted-runner emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048
          script: |
            adb shell settings put system font_scale 1.3
            gradle -p android --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-acceptance-android-ui
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
  ios-ui:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and prepare an iPhone simulator
        run: |
          bash scripts/select_xcode.sh
          bash scripts/ios_simulator.sh
      - run: brew install xcodegen
      - name: Generate the native project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Exercise optional guides in the installed simulator app
        run: |
          xcodebuild -project ios/SentinelCrier.xcodeproj -scheme CustomerAcceptance \
            -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/customer-ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-acceptance-ios-ui
          path: ${{ runner.temp }}/customer-ui.xcresult
