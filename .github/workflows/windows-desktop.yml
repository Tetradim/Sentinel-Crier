name: Windows desktop
on:
  push:
    paths: ['release.json', 'desktop/**', 'crier/**', 'tests/**', 'pyproject.toml', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['release.json', 'desktop/**', 'crier/**', 'tests/**', 'pyproject.toml', '.github/workflows/windows-desktop.yml']
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[test,desktop-build]"
      - run: python -m pytest -q
      - name: Build and smoke-test portable app
        shell: pwsh
        run: ./desktop/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelCrier-Windows
          path: dist/SentinelCrier-Windows.zip
          if-no-files-found: error
