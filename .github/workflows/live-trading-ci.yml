name: Crier live-trading safety checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit tests (no broker connections)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q --junitxml=acceptance-results/python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-acceptance-results
          path: acceptance-results/python.xml
          if-no-files-found: warn

  ios:
    name: Native iOS compile and trading tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode
        run: bash scripts/select_xcode.sh
      - name: Prepare available iPhone simulator
        run: bash scripts/ios_simulator.sh
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate --spec project.yml
      - name: Build simulator app
        run: |
          xcodebuild -project ios/SentinelCrier.xcodeproj \
            -scheme SentinelCrier \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run quantity and portfolio safety tests
        run: |
          xcodebuild -project ios/SentinelCrier.xcodeproj \
            -scheme TradingTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/trading-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-acceptance-results
          path: ${{ runner.temp }}/trading-tests.xcresult
          if-no-files-found: warn
