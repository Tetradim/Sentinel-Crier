name: Signed iPhone package
on:
  workflow_dispatch:
    inputs:
      method:
        description: Match provisioning profile type
        type: choice
        required: true
        default: app-store-connect
        options: [app-store-connect, release-testing, debugging]
      build_number:
        description: New numeric build number, greater than every previous upload
        type: string
        required: true
      previous_build_number:
        description: Highest previous App Store Connect build (0 only if never uploaded)
        type: string
        required: true
      upload_testflight:
        description: Explicitly upload to App Store Connect for TestFlight processing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 40
    environment: ios-signing
    env:
      EXPORT_METHOD: ${{ inputs.method }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      PREVIOUS_BUILD_NUMBER: ${{ inputs.previous_build_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight required signing and optional upload secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
        run: |
          set -euo pipefail
          upload_args=()
          if [ "$UPLOAD_TESTFLIGHT" = 'true' ]; then upload_args+=(--upload); fi
          python3 scripts/ios-release.py preflight --method "$EXPORT_METHOD" "${upload_args[@]}"
      - name: Select installed Xcode
        run: bash scripts/select_xcode.sh
      - name: Validate and install signing identity
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name, target in [('BUILD_CERTIFICATE_BASE64','signing.p12'), ('BUILD_PROVISION_PROFILE_BASE64','crier.mobileprovision')]:
              (root / target).write_bytes(base64.b64decode(os.environ[name], validate=True))
          PY
          security cms -D -i "$RUNNER_TEMP/crier.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 scripts/ios-release.py profile --method "$EXPORT_METHOD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/crier.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/crier.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/crier.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/crier.keychain-db" >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/crier.keychain-db" >/dev/null
          security list-keychain -d user -s "$RUNNER_TEMP/crier.keychain-db"
      - name: Generate project and archive
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/crier.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          brew install xcodegen
          python3 scripts/ios-release-project.py
          (cd ios && xcodegen generate)
          xcodebuild -project ios/SentinelCrier.xcodeproj -scheme SentinelCrier -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Crier.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$RELEASE_BUILD" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Crier.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/CrierExport"
          python3 scripts/ios-release.py manifest --method "$EXPORT_METHOD"
      - name: Save signed package and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel-Crier-${{ inputs.method }}-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/CrierExport/*.ipa
            ${{ runner.temp }}/CrierExport/release-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload to App Store Connect for TestFlight processing
        if: ${{ inputs.upload_testflight }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib, re
          key_id = os.environ['APP_STORE_CONNECT_KEY_ID']
          if not re.fullmatch(r'[A-Za-z0-9]+', key_id):
              raise SystemExit('Invalid API key identifier')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'private_keys'
          directory.mkdir(mode=0o700, exist_ok=True)
          key = directory / ('AuthKey_' + key_id + '.p8')
          key.write_bytes(base64.b64decode(os.environ['APP_STORE_CONNECT_PRIVATE_KEY_BASE64'], validate=True))
          key.chmod(0o600)
          PY
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP"/CrierExport/*.ipa --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove signing and upload credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/crier.keychain-db" || true
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ('signing.p12', 'crier.mobileprovision', 'profile.plist'):
              (root / name).unlink(missing_ok=True)
          keys = root / 'private_keys'
          if keys.exists():
              for key in keys.glob('AuthKey_*.p8'):
                  key.unlink()
              keys.rmdir()
          profile = os.environ.get('PROFILE_UUID')
          if profile:
              (pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles' / (profile + '.mobileprovision')).unlink(missing_ok=True)
          PY
