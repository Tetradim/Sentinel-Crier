project_id = "sentinel-crier"

[functions.crier]
# Crier uses its own opaque host/receiver tokens, validated by the DB RPC on
# every protected call. Supabase JWT validation would reject those tokens.
verify_jwt = false

[functions.crier-oauth]
# Browser login/callback requests have no platform JWT header. The separate
# handler validates native and browser customer sessions through Auth itself.
verify_jwt = false
