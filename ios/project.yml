name: SentinelCrier
options:
  bundleIdPrefix: com.tetradim
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
configFiles:
  Debug: ReleaseVersion.xcconfig
  Release: ReleaseVersion.xcconfig
targets:
  SentinelCrier:
    type: application
    platform: iOS
    sources:
      - path: SentinelCrier/Assets.xcassets
      - path: SentinelCrier/PrivacyInfo.xcprivacy
      - path: SentinelCrier/AlpacaREST.swift
      - path: SentinelCrier/AlpacaAlertFormatter.swift
      - path: SentinelCrier/AlpacaJournal.swift
      - path: SentinelCrier/AlpacaWorkspace.swift
      - path: SentinelCrier/GuidedSetup.swift
      - path: SentinelCrier/PracticeGuide.swift
      - path: ../crier/customer-practice.json
        buildPhase: resources
      - path: SentinelCrier/MirrorConnection.swift
      - path: SentinelCrier/IntentDiagnostics.swift
      - path: SentinelCrier/CopyDashboard.swift
      - path: SentinelCrier/IntentMirroring.swift
      - path: SentinelCrier/IntentViews.swift
      - path: SentinelCrier/QuickConnection.swift
      - path: SentinelCrier/OAuthReturn.swift
      - path: SentinelCrier/ProviderConnections.swift
      - path: SentinelCrier/WebullHostModels.swift
      - path: SentinelCrier/WebullHostController.swift
      - path: SentinelCrier/WebullHostView.swift
      - path: SentinelCrier/NativeHealth.swift
      - path: SentinelCrier/EntryClock.swift
      - path: SentinelCrier/NativeHealthView.swift
      - path: ../crier/connection-service.json
        buildPhase: resources
      - path: SentinelCrier/SentinelCrierApp.swift
      - path: SentinelCrier/StandaloneConfiguration.swift
      - path: SentinelCrier/CrierCommandCenter.swift
      - path: SentinelCrier/LiveTradingModels.swift
      - path: SentinelCrier/TradingPreferences.swift
      - path: SentinelCrier/BrokerageOverview.swift
      - path: SentinelCrier/TradingCharts.swift
      - path: SentinelCrier/TradingCandleCanvas.swift
      - path: SentinelCrier/TradingChartWorkspace.swift
      - path: SentinelCrier/TradingViewHostedChart.swift
      - path: SentinelCrier/LiveBrokerGateway.swift
      - path: SentinelCrier/MultiBrokerAllocation.swift
      - path: SentinelCrier/MultiBrokerTradeGroups.swift
      - path: SentinelCrier/MultiBrokerExecutionCoordinator.swift
      - path: SentinelCrier/VerifiedExecutionOutbox.swift
      - path: SentinelCrier/VerifiedExecutionDiscordPublisher.swift
      - path: SentinelCrier/LiveTradingHome.swift
    info:
      path: Generated/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.tetradim.sentinelcrier.oauth
            CFBundleURLSchemes: [sentinelcrier]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tetradim.sentinelcrier
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sentinel Crier
        INFOPLIST_KEY_CrierSharedKeychainGroup: "$(AppIdentifierPrefix)com.tetradim.sentinelcrier.shared"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SentinelCrier.entitlements
  TradingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SentinelCrier/AlpacaTests.swift
      - path: SentinelCrier/GuidedSetupTests.swift
      - path: SentinelCrier/PracticeGuideTests.swift
      - path: SentinelCrier/MirrorTests.swift
      - path: SentinelCrier/IntentDiagnosticsTests.swift
      - path: SentinelCrier/CopyDashboardTests.swift
      - path: ../tests/fixtures/copy-dashboard.json
        buildPhase: resources
      - path: SentinelCrier/IntentTests.swift
      - path: SentinelCrier/IntentPolicyTests.swift
      - path: ../tests/fixtures/policy-preview.json
        buildPhase: resources
      - path: SentinelCrier/QuickConnectionTests.swift
      - path: SentinelCrier/OAuthReturnTests.swift
      - path: SentinelCrier/ProviderConnectionsTests.swift
      - path: SentinelCrier/WebullHostTests.swift
      - path: SentinelCrier/NativeHealthTests.swift
      - path: SentinelCrier/EntryClockTests.swift
      - path: SentinelCrier/NativeHealthFlowTests.swift
      - path: ../tests/fixtures/oauth-return.json
        buildPhase: resources
      - path: SentinelCrier/Phase2FlowTests.swift
      - path: ../tests/fixtures/phase2-protocol.json
        buildPhase: resources
      - path: SentinelCrier/AlpacaAlertFormatterTests.swift
      - path: SentinelCrier/MultiBrokerTradingTests.swift
      - path: SentinelCrier/TradingChartTests.swift
    dependencies:
      - target: SentinelCrier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tetradim.sentinelcrier.TradingTests
        GENERATE_INFOPLIST_FILE: YES
  CustomerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CustomerUITests
    dependencies:
      - target: SentinelCrier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tetradim.sentinelcrier.CustomerUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SentinelCrier
schemes:
  SentinelCrier:
    build:
      targets:
        SentinelCrier: all
  TradingTests:
    build:
      targets:
        SentinelCrier: all
    test:
      targets:
        - TradingTests
  CustomerAcceptance:
    build:
      targets:
        SentinelCrier: all
    test:
      targets:
        - CustomerUITests
