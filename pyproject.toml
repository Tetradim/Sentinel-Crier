[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-crier"
version = "0.2.0"
description = "Broker fill alerts with an iPhone-first console"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "tzdata==2026.5"]

[project.optional-dependencies]
webull = ["webull-openapi-python-sdk==3.0.3"]
test = ["pytest==9.1.1"]

[project.scripts]
crier = "crier.__main__:main"

[tool.setuptools.package-data]
crier = ["static/*"]

[tool.setuptools.packages.find]
include = ["crier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
