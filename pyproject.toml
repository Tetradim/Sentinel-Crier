[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-crier"
version = "0.3.0"
description = "Broker fill alerts with an iPhone-first console"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1", "httpcore==1.0.9", "tzdata==2026.5", "cryptography==50.0.2"]

[project.optional-dependencies]
webull = ["webull-openapi-python-sdk==3.0.3"]
oauth = ["cryptography==50.0.2"]
test = ["pytest==9.1.1"]
desktop = ["pystray==0.19.5; sys_platform == 'win32'", "pillow==13.0.0; sys_platform == 'win32'"]
desktop-build = ["pyinstaller==6.16.0", "pystray==0.19.5; sys_platform == 'win32'", "pillow==13.0.0; sys_platform == 'win32'"]

[project.gui-scripts]
crier-desktop = "crier.desktop:main"

[project.scripts]
crier = "crier.__main__:main"

[tool.setuptools.package-data]
crier = ["static/*", "connection-service.json", "customer-practice.json", "update-policy.json"]

[tool.setuptools.packages.find]
include = ["crier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
